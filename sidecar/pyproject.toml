[project]
name = "echoes-sidecar"
version = "0.1.0"
description = "Echoes 桌面版 sidecar：契约定义以 docs/architecture.md 为唯一来源"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "websockets>=12,<15",
  "httpx>=0.27,<2",
  # ML 依赖 == 精确锁（15.1；实测装机版 2026-10-22）
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.3",
  "numpy==2.5.4",
  # ---- CosyVoice2 inference 依赖子集（ADR-014 决策 4；== 锚取上游 requirements） ----
  "torch==2.7.1",                # cu126 轮子；冒烟失败回上游锚 2.3.1+cu121 走 12.2
  "torchaudio==2.7.1",
  # 上游锚 1.18.0 无 cp313 轮子，升锁（ADR-014 修订）
  "transformers==4.51.3",
  "conformer==0.3.2",
  "diffusers==0.29.0",
  "hyperpyyaml==1.2.3",
  "omegaconf==2.3.0",
  "inflect==7.3.1",
  "wetext==0.0.4",
  "x-transformers==2.11.24",
  "modelscope==1.20.0",
  "openai-whisper==20250625",   # 上游锚 20231117 的 setup.py 在 py3.13（PEP 667 locals 快照）下 build 必炸，升锁（ADR-014 修订）
  "soundfile==0.12.1",
  "tiktoken==0.14.0",            # 上游 requirements 漏声明而代码必需（冒烟经过确认）
  "scipy>=1.18.1",
  "hydra-core==1.3.2",
  "lightning==2.2.4",
  "setuptools<81",
  "gdown==5.1.0",
  "wget==3.2",
  "matplotlib>=3.11.2",
  "librosa==0.10.2",
  "pyarrow==18.1.0",
  "pyworld==0.3.5",
  "onnxruntime-gpu==1.22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
]

# ------------------------------ 工具链（母文档 §15） ------------------------------

[tool.ruff]
line-length = 100          # §15.3：ruff 100 列
target-version = "py311"
# vendored 上游原样代码不参与本仓 lint（ADR-014）
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
# strict 边界 = §15.3 v1.4 + 修复轮扩展（评审 🟡-2）：三个 engines base.py 与 main.py 纳入；
# engines 的 mock/未来实现内部放宽，tests 不在边界内
files = [
  "echoes_sidecar/core",
  "echoes_sidecar/ipc",
  "echoes_sidecar/transport",
  "echoes_sidecar/audio",
  "echoes_sidecar/session",
  "echoes_sidecar/orchestration",
  "echoes_sidecar/memory",
  "echoes_sidecar/engines/asr/base.py",
  "echoes_sidecar/engines/tts/base.py",
  "echoes_sidecar/engines/llm/base.py",
  "echoes_sidecar/main.py",
]

# 第三方无 py.typed 的 ML 库（15.1 锚定 SDK：接口签名在 base.py 契约层自持）
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "cosyvoice.*", "wetext.*", "scipy.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.importlinter]
root_package = "echoes_sidecar"

# §15.2 依赖图（v1.4 收口版 + 修复轮重排，评审 🟡-3）：上层只许向下；
# 同层兄弟（| 分隔）互不 import；ipc 是全工程唯一 pydantic 层。
# key: main → orchestration → session|transport → engines|memory → audio|ipc → core
[[tool.importlinter.contracts]]
name = "15.2 依赖分层（v1.4）"
type = "layers"
layers = [
  "echoes_sidecar.main",
  "echoes_sidecar.orchestration",
  "echoes_sidecar.session | echoes_sidecar.transport",
  "echoes_sidecar.engines | echoes_sidecar.memory",
  "echoes_sidecar.audio | echoes_sidecar.ipc",
  "echoes_sidecar.core",
]

# 3.2「组装归组合根」：编排只依赖引擎 ABC（engines.*.base），
# 具体引擎实现（mock/未来 faster_whisper/cosyvoice2/ollama/cloud_api——阶段 0 落地时追加）
[[tool.importlinter.contracts]]
name = "编排不 import 具体引擎（3.2，修复轮）"
type = "forbidden"
source_modules = ["echoes_sidecar.orchestration"]
forbidden_modules = [
  "echoes_sidecar.engines.asr.mock",
  "echoes_sidecar.engines.tts.mock",
  "echoes_sidecar.engines.llm.mock",
]

# ------------------------------ uv 项目锁（15.1；ADR-014） ------------------------------

# whisper 20231117 的 setup.py 用 pkg_resources 却未声明 build 依赖
# （setuptools 新版剥离 pkg_resources），build 时补装
[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true


# torch/torchaudio 走 PyTorch 官方 cu126 轮子（15.1「CUDA 12.6 轮子 == 锁」），
# 其余包走默认 index（国内镜像由 UV_DEFAULT_INDEX 注入，见 progress.md 记账）
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]
