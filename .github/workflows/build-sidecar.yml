# 7.2 CI 边界：runner 无 GPU——只验证 CPU 路径（单测 + 契约 + 静态闸）。
# GPU 冒烟走本机脚本 sidecar/scripts/gpu_smoke.py（13.1-L4）；禁止把 CUDA torch 构建塞进 CI。
name: build-sidecar
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sidecar-skeleton:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # R1（ledger）：开发解释器 3.13；模型依赖锁定阶段（15.1）再定运行时口径
          python-version: "3.13"
      - name: 安装依赖（CPUD-only 面，15.1）
        run: python -m pip install pydantic "websockets>=12,<15" pytest pytest-asyncio ruff mypy import-linter
        working-directory: sidecar
      - name: lint（ruff，100 列，15.3）
        run: ruff check .
        working-directory: sidecar
      - name: 类型（mypy strict 边界，15.3）
        run: python -m mypy
        working-directory: sidecar
      - name: 契约测试（13.1-L2 / 13.2）
        run: python -m pytest -q
        working-directory: sidecar
      - name: 依赖分层（15.2 v1.4，import-linter）
        run: lint-imports
        working-directory: sidecar
