# 13.2-1：schema 单一来源——`src/lib/ipc_types.ts` 由 sidecar 的 pydantic 模型生成
# （`sidecar/echoes_sidecar/ipc/tsexport.py`），CI 重新生成并与入库生成物对拍，
# 漂移即红。消息方向/字段/错误码改一处而忘了改另一处，这里会立刻拦下来。
#
# 为什么要装依赖：生成器 import pydantic + 消息模型，裸 Python 跑不起来。
# 只装生成所需的最小集（不碰 torch/ML，与 build-sidecar 的骨架依赖同思路）。
name: schema-drift
on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 sidecar 骨架依赖（生成器只需 pydantic）
        working-directory: sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.7,<3"

      - name: 生成（与入库生成物对拍）
        # scripts/gen-ipc-types.mjs 找不到 .venv 时按 PATH 找 python3
        run: node scripts/gen-ipc-types.mjs --check

      - name: 前端类型检查（生成物必须能编译）
        run: |
          npm ci
          npx vue-tsc --noEmit
