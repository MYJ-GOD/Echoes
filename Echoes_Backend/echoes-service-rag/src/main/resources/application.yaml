spring:
  config:
    import:
      - optional:nacos:Echoes--rag.yaml
  application:
    name: echoes-service-rag
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:echoes}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:echoes}
    password: ${DB_PASSWORD:echoes}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
        refresh-enabled: true


server:
  port: 18086

# RAG 閰嶇疆
rag:
  langgraph-url: http://localhost:8088/api/v1
  qdrant:
    url: http://localhost:6333
    api-key:
    collection-knowledge: knowledge_chunks
    collection-conversation: conversation_history
    vector-size: 1024
    default-top-k: 5
    default-threshold: 0.5

# MyBatis Plus 閰嶇疆
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.echoes.rag.domain.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 鏃ュ織
logging:
  level:
    com.echoes.rag: DEBUG
    io.qdrant: INFO

# Swagger/Knife4j 閰嶇疆
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
