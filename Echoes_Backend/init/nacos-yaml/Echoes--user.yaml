# Echoes 用户服务配置
# Data ID: Echoes--user.yaml
# Group: DEFAULT_GROUP
# 配置格式: YAML
# 
# 注意：此配置会覆盖 application.yaml 中的同名配置

server:
  port: 18081

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${echoes.datasource.host:localhost}:${echoes.datasource.port:3306}/${echoes.datasource.database:echoes}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${echoes.datasource.username:root}
    password: ${echoes.datasource.password:root}
    druid:
      # 初始连接数
      initial-size: 5
      # 最小连接池数量
      min-idle: 5
      # 最大连接池数量
      max-active: 20
      # 配置获取连接等待超时的时间（单位：毫秒）
      max-wait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位：毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位：毫秒
      min-evictable-idle-time-millis: 300000
      # 配置一个连接在池中最大生存的时间，单位：毫秒
      max-evictable-idle-time-millis: 900000
      # 用来检测连接是否有效的 SQL
      validation-query: SELECT 1
      # 建议配置为 true，不影响性能，并且保证安全性
      test-while-idle: true
      # 申请连接时执行 validationQuery 检测连接是否有效，做了这个配置会降低性能
      test-on-borrow: false
      # 归还连接时执行 validationQuery 检测连接是否有效，做了这个配置会降低性能
      test-on-return: false
      # 是否缓存 preparedStatement，也就是 PSCache
      pool-prepared-statements: true
      # 要启用 PSCache，必须配置大于 0，当大于 0 时，pool-prepared-statements 自动触发修改为 true
      max-pool-prepared-statement-per-connection-size: 20
      # 配置监控统计拦截的 filters，去掉后监控界面 SQL 无法统计，'wall' 用于防火墙
      filters: stat,wall,slf4j
      # 通过 connectProperties 属性来打开 mergeSql 功能；慢 SQL 记录
      connection-properties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
      # 合并多个 DruidDataSource 的监控数据
      use-global-data-source-stat: true
      # 监控页面配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        # 控制台管理用户名和密码（生产环境建议修改）
        login-username: admin
        login-password: admin
        reset-enable: false
      # Web 监控配置
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.echoes.entity

# JWT 配置
sky:
  jwt:
    # 用户端JWT配置（密钥必须至少 32 字节/256 位）
    user-secret-key: ${JWT_USER_SECRET_KEY:change-me-user-secret-key-0123456789abcdef}  # 至少 32 字符
    user-ttl: 7200000  # Token过期时间：2小时（毫秒）
    user-token-name: token

# SpringDoc/Knife4j 配置（API 文档）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /doc.html

