# Echoes RAG Service config (Nacos)
# Data ID: Echoes--rag.yaml
# Group: DEFAULT_GROUP

server:
  port: 18086

spring:
  application:
    name: echoes-service-rag
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${echoes.datasource.host:localhost}:${echoes.datasource.port:3306}/${echoes.datasource.database:echoes}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${echoes.datasource.username:root}
    password: ${echoes.datasource.password:root}

# RAG core settings
rag:
  langgraph-url: ${RAG_LANGGRAPH_URL:http://localhost:8088/api/v1}
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
    collection-knowledge: knowledge_chunks
    collection-conversation: conversation_history
    vector-size: 1024
    default-top-k: 5
    default-threshold: 0.5

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.echoes.rag.domain.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# API docs
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /doc.html

# Logging
logging:
  level:
    com.echoes.rag: INFO
    io.qdrant: INFO
