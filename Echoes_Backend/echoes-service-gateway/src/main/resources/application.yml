# Echoes Gateway Service - 本地配置文件
# 仅保留必要的本地配置，其他配置请从 Nacos 配置中心加载
spring:
  application:
    name: echoes-gateway
  main:
    web-application-type: reactive
  config:
    import:
      - "optional:nacos:application.yaml?group=DEFAULT_GROUP"
      - "optional:nacos:Echoes--gateway.yaml?group=DEFAULT_GROUP"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
