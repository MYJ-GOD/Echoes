# Echoes User Service - 本地配置文件
# 仅保留必要的本地配置，其他配置请从 Nacos 配置中心加载
spring:
  application:
    name: echoes-service-user
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - "optional:nacos:application.yaml?group=DEFAULT_GROUP"
      - "optional:nacos:Echoes--user.yaml?group=DEFAULT_GROUP"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml

