[package]
name = "echoes-shell"
version = "0.1.0"
description = "Echoes desktop shell (Tauri 2)"
authors = ["MYJ-GOD"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "echoes_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "net", "time"] }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", features = ["sink"] }
